<body>
    {{topbar}}
    <main class="index">
        <div class="search-wrap">
            <div class="search-box">
                <input type="search" id="searchbar" placeholder="search posts…" autocomplete="off" />
                <span class="search-icon" aria-hidden="true"></span>
            </div>
            <div id="tagbar" class="tagbar" hidden><span class="tagbar-label"></span><span id="tagbar-tags"></span><button type="button" id="tagclear" class="tag-clear" hidden>clear</button></div>
        </div>
        <ul id="list">
            {{post-list}}
        </ul>
        <p id="empty" class="empty" hidden>Nothing matches.</p>
        <p class="hints">
            <kbd>j</kbd><kbd>k</kbd> move ·
            <kbd>gg</kbd><kbd>G</kbd> top/bottom ·
            <kbd>↵</kbd> open ·
            <kbd>/</kbd> search ·
            <kbd>t</kbd> theme ·
            <kbd>esc</kbd> reset
        </p>
    </main>
    <script>
    const sb       = document.getElementById('searchbar');
    const empty    = document.getElementById('empty');
    const tagbar   = document.getElementById('tagbar');
    const tagtags  = document.getElementById('tagbar-tags');
    const tagclear = document.getElementById('tagclear');
    const items    = [...document.querySelectorAll('#list li')];

    const norm    = (s) => (s || '').toLowerCase().trim();
    const tagsOf  = (li) => (li.dataset.tags || '').split(',').filter(Boolean);
    const visible = () => items.filter((li) => !li.hidden);
    const active = new Set();

    function matches(li) {
        const tags = tagsOf(li);
        for (const t of active) {
            if (!tags.includes(t)) return false;
        }

        const q = norm(sb.value);
        if (q === '') return true;

        return [li.dataset.name, li.dataset.desc, tags.join(' ')]
            .map(norm)
            .join(' ')
            .includes(q);
    }

    function apply() {
        for (const li of items) li.hidden = !matches(li);
        const vis = visible();
        empty.hidden = vis.length > 0;
        if (current && current.hidden) select(vis[0] || null);
    }

    function toggleTag(tag) {
        if (active.has(tag)) active.delete(tag);
        else active.add(tag);
        for (const b of document.querySelectorAll('.tag')) {
            b.classList.toggle('is-on', active.has(b.dataset.tag));
        }
        tagclear.hidden = active.size === 0;
        apply();
    }

    const allTags = [...new Set(items.flatMap(tagsOf))].sort();

    allTags.forEach((tag, i) => {
        if (i > 0) {
            const sep = document.createElement('span');
            sep.className = 'sep';
            sep.textContent = '·';
            tagtags.append(sep);
        }
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tag';
        b.dataset.tag = tag;
        b.textContent = tag;
        tagtags.append(b);
    });

    tagbar.hidden = allTags.length === 0;

    document.addEventListener('click', (e) => {
        if (e.target.closest('#tagclear')) {
            for (const t of [...active]) toggleTag(t);
            return;
        }

        const b = e.target.closest('.tag');
        if (!b) return;
        e.preventDefault();
        toggleTag(b.dataset.tag);
    });

    sb.addEventListener('input', apply);

    let current = null;

    function select(li) {
        if (current) current.classList.remove('is-active');
        current = li;
        if (!li) return;
        li.classList.add('is-active');
        li.scrollIntoView({ block: 'nearest' });
    }

    function move(dir) {
        const vis = visible();
        if (vis.length === 0) return;

        const i = current ? vis.indexOf(current) : -1;
        let next;

        switch (dir) {
            case 'top':    next = 0; break;
            case 'bottom': next = vis.length - 1; break;
            case 'up':     next = i <= 0 ? 0 : i - 1; break;
            case 'down':   next = i < 0 ? 0 : Math.min(i + 1, vis.length - 1); break;
        }

        select(vis[next]);
    }

    function open() {
        const a = current && current.querySelector('.post-link');
        if (a) window.location.href = a.href;
    }

    let pendingG = false;

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        const searching = document.activeElement === sb;

        if (e.key === '/' && !searching) {
            e.preventDefault();
            sb.focus();
            sb.select();
            return;
        }

        if (e.key === 'Escape') {
            if (searching) {
                sb.value = '';
                apply();
                sb.blur();
            } else {
                for (const t of [...active]) toggleTag(t);
            }
            return;
        }

        if (e.key === 'Tab') {
            e.preventDefault();
            move(e.shiftKey ? 'up' : 'down');
            return;
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            if (searching) {
                sb.blur();
                if (!current) move('top');
            } else {
                open();
            }
            return;
        }

        if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); move('up');   return; }

        if (searching) return;

        switch (e.key) {
            case 'j': e.preventDefault(); move('down');   break;
            case 'k': e.preventDefault(); move('up');     break;
            case 'G': e.preventDefault(); move('bottom'); break;
            case 'o': e.preventDefault(); open();         break;
            case 'g':
                e.preventDefault();
                if (!pendingG) {
                    pendingG = true;
                    setTimeout(() => { pendingG = false; }, 500);
                    return;
                }
                move('top');
                break;
        }

        pendingG = false;
    });
    </script>
</body>
